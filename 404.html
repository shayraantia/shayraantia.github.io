html,body{height:100%;}
body{
  background:#171310;
  color:#F7F3EA;
  font-family:'Bodoni Moda',Georgia,serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
}
/* warm light, off-centre, so the ground is not flat */
body::before{
  content:'';position:absolute;inset:-20%;
  background:
    radial-gradient(48% 42% at 62% 34%, rgba(196,166,97,.20), transparent 62%),
    radial-gradient(40% 46% at 30% 76%, rgba(216,185,178,.15), transparent 66%);
  pointer-events:none;
}
.name{
  position:relative;
  font-size:clamp(68px,17vw,320px);
  font-weight:400;
  letter-spacing:-.035em;
  font-style:italic;
  line-height:1;
  background:linear-gradient(104deg,#F0E4CB 0%,#C4A661 34%,#EBD9C2 58%,#D8B9B2 100%);

  color:transparent;
  -webkit-text-fill-color:transparent;
  padding:.12em .06em;
  animation:rise 1.5s cubic-bezier(.2,.7,.2,1) both;
